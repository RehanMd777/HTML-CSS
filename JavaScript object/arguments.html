<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Finding the largest number</h3>
    <p id="result"></p>
    <script>
        function findMax() {
            var i
            var max=0;
            for(i=0; i < arguments.length; i++){
            if (arguments[i] > max){
                max=arguments[i];
            }
            }
            return max;

        }
        document.getElementById(id="result").innerHTML= findMax(4,5,6,7,17,5,51,77,91.197,199.99);
    </script>
</body>
</html>
