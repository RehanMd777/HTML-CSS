<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
      /* CSS Reset & Global Styles */

* {

box-sizing: border-box;

padding: 0;

margin: 0;

font-family: "Open Sans", sans-serif;

font-weight: bold;

}

::placeholder {

color: rgb(221, 221, 221);

opacity: 0.3;

}

.wrapper {

height: 100%;

width: 100%;

display: flex;

justify-content: center;

flex-direction: column;

align-items: center;

background-color: rgb(20, 19, 19);

transition: 0.8s all;

}

h1 {

text-align: center;

margin-bottom: 1.5%;

color: #fff;

}

.container {

width: 300px;

}

.result {

width: 59.1%;

}

input {

padding: 25px;

color: rgb(255, 255, 255);

font-size: 1em;

cursor: pointer;

width: 70px;

background-color: rgb(47, 51, 50);

border: none;

outline: none;

border-radius: 4px;

}

.row {

margin-bottom: 3px;

}

input[type="text"] {

background-color: rgb(47, 51, 50);

width: 218px;

}

input[type="button"]:hover {

background-color: rgb(160, 160, 160);

color: #fff;

}

button {

border: none;

background-color: rgb(39, 36, 36);

padding: 8px;

color: white;

margin: 2px;

cursor: pointer;

outline: none;

border-radius: 4px;

font-size: 0.8em;

font-weight: 200;

}

.clear-button{

color: #fff;

background-color: rgb(255, 42, 42);

width: 97.5%;

}
    </style>
</head>
<body>
    <div class="wrapper"></div>
    <div class="container"></div>
    <h1>Calculator</h1>
    <div class="row"></div>
    <input type="text"  name="result"  class="result"  id="result"  value=""  placeholder="Result"  readonly/>
      <div class="row">
    <input type="button" value="+"  onclick="SetscreenValue('+')">
    <input type="button" value="1" onclick="SetscreenValue('1')">
    <input type="button" value="2" onclick="SetscreenValue('2')">
    <input type="button" value="3" onclick="SetscreenValue('3')">
    <input type="button" value="-" onclick="SetscreenValue('-')">
      </div>
      <div class="row">
        <input type="button" value="4" onclick="SetscreenValue('4')">
        <input type="button" value="5" onclick="SetscreenValue('5')">
        <input type="button" value="6" onclick="SetscreenValue('6')">
        <input type="button" value="x" onclick="SetscreenValue('*')">

      </div>
      <div class="row">
        
        <input type="button" value="7" onclick="SetscreenValue('7')">
        <input type="button" value="8" onclick="SetscreenValue('8')">
        <input type="button" value="9" onclick="SetscreenValue('9')">
        <input type="button" value="/" onclick="SetscreenValue('/')">
      </div>
      <div class="row">
        <input type="button" value="%" onclick="SetscreenValue('%')">
        <input type="button" value="0" onclick="SetscreenValue('0')">
        <input type="button" value="." onclick="SetscreenValue('.')">
        <input type="button"  value="=" onclick="CalculateResult()">
      </div>
      <div class="row">
        <input type="button" value="CLEAR" onclick="clearScreen" id="clear" class="clear_button">


      </div>
    </div>

      </div>
    <script src="script.js"></script>

    <script>
      function clearScreen() {
        document.getElementById("result").value=""
      }


      function SetscreenValue(value) {
        document.getElementById("result").value+=value
      }
      function calculateResult () {
        const resultElement = document.getElementById("result")
        const expression = resultElement.value.trim();
      }

      if (expression === '') {
        resultElement.value = 'Enter an expression';
        return;
      }
      try {
        resultElement.value = eval(expression);
      } catch (e) {
        resultElement.value= 'Invalid Expression'
      }
    
    </script>

</body>
</html>
